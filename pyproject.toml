[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trueid-live-commerce-copilot"
version = "0.1.0"
description = "Offline-friendly captioning slice for a TrueID live commerce copilot demo."
requires-python = ">=3.9"
dependencies = [
  "PyYAML==6.0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
