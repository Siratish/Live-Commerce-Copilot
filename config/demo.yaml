captioning:
  mode: auto
  language: th
  cached_transcript_path: data/demo/audio_1_captions.json
  audio_path: data/demo/audio/1.mp3
  asr_provider: openai_whisper
  asr_model: large
  whisper_model: large
  # To use Typhoon Whisper for Thai ASR, set:
  # asr_provider: typhoon_whisper
  # asr_model: turbo
  # Typhoon aliases: large-v3, turbo, medium, monsoon-medium, isan-medium
  asr_chunk_length_seconds: 30
  asr_batch_size: 16
  # Whisper decoder context is 448 tokens; keep room for language/task tokens.
  asr_max_new_tokens: 440
  allow_cached_fallback: true

outputs:
  directory: outputs
  captions_json: captions.json
  captions_vtt: captions.vtt
  captions_srt: captions.srt
  metrics_json: caption_metrics.json
