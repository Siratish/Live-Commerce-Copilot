captioning:
  mode: auto
  language: th
  cached_transcript_path: data/demo/captions/audio_1_captions.json
  audio_path: data/demo/audio/1.mp3
  asr_provider: openai_whisper
  asr_model: large
  whisper_model: large
  asr_chunk_length_seconds: 4
  asr_dynamic_chunking: true
  asr_min_chunk_seconds: 1.0
  asr_pause_seconds: 0.7
  asr_silence_threshold: 0.012
  asr_frame_seconds: 0.1
  allow_cached_fallback: true

outputs:
  directory: outputs
  captions_json: captions.json
  captions_vtt: captions.vtt
  captions_srt: captions.srt
  metrics_json: caption_metrics.json
